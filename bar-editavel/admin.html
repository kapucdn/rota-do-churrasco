<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rota do Churrasco — Admin</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --carvao: #221510;
    --brasa: #E8590C;
    --brasa-escura: #B8430A;
    --dourado: #F4B93F;
    --papel: #FBF3E7;
    --papel-escuro: #E8DCC8;
    --texto-escuro: #2B1B12;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--papel);
    color: var(--texto-escuro);
    font-family: "Work Sans", sans-serif;
    min-height: 100vh;
  }
  h1, h2 { font-family: "Fraunces", serif; }

  .topo {
    background: var(--carvao);
    color: var(--dourado);
    padding: 18px 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .topo a { color: var(--papel-escuro); text-decoration: none; font-size: 0.85rem; }

  .conteudo { max-width: 720px; margin: 0 auto; padding: 32px 20px 80px; }

  .login-box {
    max-width: 360px;
    margin: 80px auto;
    background: white;
    border: 1px solid var(--papel-escuro);
    border-radius: 8px;
    padding: 28px;
    text-align: center;
  }
  .login-box input {
    width: 100%;
    padding: 10px 12px;
    margin: 14px 0;
    border: 1px solid var(--papel-escuro);
    border-radius: 6px;
    font-size: 1rem;
  }

  button {
    background: var(--brasa);
    color: white;
    border: none;
    padding: 10px 18px;
    border-radius: 6px;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
  }
  button:hover { background: var(--brasa-escura); }
  button.secundario { background: transparent; color: var(--brasa-escura); border: 1px solid var(--brasa-escura); }
  button.perigo { background: #a33; }

  .erro-msg { color: #a33; font-size: 0.85rem; margin-top: 6px; min-height: 1.2em; }

  .card-prato {
    background: white;
    border: 1px solid var(--papel-escuro);
    border-radius: 8px;
    padding: 16px;
    margin-bottom: 14px;
  }
  .card-prato .linha1 { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  .card-prato .nome { font-weight: 600; font-size: 1.05rem; }
  .card-prato .preco { font-family: "Fraunces", serif; color: var(--brasa-escura); font-weight: 600; }
  .card-prato .desc { color: #6b5a48; font-size: 0.88rem; margin-top: 4px; }
  .card-prato .categoria-tag {
    display: inline-block; font-size: 0.72rem; text-transform: none;
    background: var(--papel-escuro); padding: 2px 8px; border-radius: 10px; margin-top: 6px;
  }
  .card-prato .acoes { margin-top: 10px; display: flex; gap: 8px; }

  form.form-prato {
    background: white;
    border: 1px solid var(--papel-escuro);
    border-radius: 8px;
    padding: 20px;
    margin-bottom: 24px;
  }
  form.form-prato label { display: block; font-size: 0.85rem; font-weight: 600; margin-top: 12px; margin-bottom: 4px; }
  form.form-prato input, form.form-prato textarea {
    width: 100%; padding: 8px 10px; border: 1px solid var(--papel-escuro); border-radius: 6px; font-family: inherit; font-size: 0.95rem;
  }
  form.form-prato .duas-colunas { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  form.form-prato .botoes { margin-top: 16px; display: flex; gap: 8px; }

  .status { font-size: 0.85rem; margin-top: 10px; min-height: 1.2em; }

  .preview-foto {
    width: 96px;
    height: 96px;
    object-fit: cover;
    object-position: center;
    border-radius: 6px;
    border: 1px solid var(--papel-escuro);
    margin-top: 8px;
  }

  .tabs-admin { display: flex; gap: 10px; margin-bottom: 24px; }
  .tab-admin {
    padding: 10px 20px; border-radius: 6px; cursor: pointer;
    font-weight: 600; border: 1px solid var(--papel-escuro);
    background: white; color: var(--texto-escuro);
  }
  .tab-admin.active { background: var(--brasa); color: white; border-color: var(--brasa); }
  .tab-content { display: none; }
  .tab-content.active { display: block; }
</style>
</head>
<body>

<div class="topo">
  <strong class="marca-fogo">Rota do Churrasco — Admin</strong>
  <a href="index.html">← ver cardápio público</a>
</div>

<div class="conteudo">

  <div id="tela-login" class="login-box">
    <h2>Entrar</h2>
    <input type="password" id="campo-senha" placeholder="Senha" autocomplete="current-password">
    <button onclick="entrar()">Entrar</button>
    <div class="erro-msg" id="erro-login"></div>
  </div>

  <div id="tela-admin" style="display:none">

    <div class="tabs-admin">
      <div class="tab-admin active" onclick="mudarAba('pratos')">Cardápio</div>
      <div class="tab-admin" onclick="mudarAba('config')">Configurações</div>
    </div>

    <div id="aba-pratos" class="tab-content active">
      <h1>Pratos do cardápio</h1>

      <form class="form-prato" id="form-prato" onsubmit="salvarPrato(event)">
        <input type="hidden" id="prato-id">
        <label>Categoria</label>
        <input type="text" id="prato-categoria" placeholder="Ex: Petiscos, Bebidas, Pratos Principais" required>

        <label>Nome do prato</label>
        <input type="text" id="prato-nome" required>

        <label>Descrição (opcional)</label>
        <textarea id="prato-descricao" rows="2"></textarea>

        <div class="duas-colunas">
          <div>
            <label>Preço (R$)</label>
            <input type="number" step="0.01" id="prato-preco" required>
          </div>
          <div>
            <label>Ordem (menor aparece primeiro)</label>
            <input type="number" id="prato-ordem" value="1">
          </div>
        </div>

        <label>Foto do prato</label>
        <input type="file" id="prato-imagem-arquivo" accept="image/*" onchange="enviarFoto()">
        <div class="status" id="status-foto"></div>
        <img id="preview-imagem" class="preview-foto" style="display:none;">
        <input type="hidden" id="prato-imagem">

        <div class="botoes">
          <button type="submit" id="botao-salvar">Adicionar prato</button>
          <button type="button" class="secundario" id="botao-cancelar" style="display:none" onclick="cancelarEdicao()">Cancelar edição</button>
        </div>
        <div class="status" id="status-form"></div>
      </form>

      <div id="lista-pratos"></div>
    </div>

    <div id="aba-config" class="tab-content">
      <h1>Configurações do Bar</h1>
      <form class="form-prato" id="form-config" onsubmit="salvarConfiguracoes(event)">

        <h2>Identidade</h2>
        <label>Nome do Bar</label>
        <input type="text" id="config-nome" required>

        <label>Subtítulo da Hero (ex: Bar e Restaurante · Guará, Brasília-DF)</label>
        <input type="text" id="config-subtitulo" required>

        <label>Descrição na Hero</label>
        <textarea id="config-tag_hero" rows="2" required></textarea>

        <h2>Contatos</h2>
        <div class="duas-colunas">
          <div>
            <label>Instagram (@arroba)</label>
            <input type="text" id="config-instagram_arroba" required>
          </div>
          <div>
            <label>Instagram URL</label>
            <input type="text" id="config-instagram_url" required>
          </div>
          <div>
            <label>Telefone (exibir)</label>
            <input type="text" id="config-telefone" required>
          </div>
          <div>
            <label>Telefone Link (ex: tel:+55...)</label>
            <input type="text" id="config-telefone_link" required>
          </div>
        </div>

        <label>Endereço</label>
        <input type="text" id="config-endereco" required>

        <h2>Integração iFood</h2>
        <label>Link do iFood</label>
        <input type="text" id="config-ifood_url" required>

        <h2>Seção: Sobre (Chapa quente, mesa cheia)</h2>
        <label>Título da seção</label>
        <input type="text" id="config-sobre_titulo" required>
        <label>Texto da seção</label>
        <textarea id="config-sobre_texto" rows="3" required></textarea>

        <h2>Seção: Ambiente</h2>
        <label>Subtítulo da seção</label>
        <textarea id="config-ambiente_subtitulo" rows="2" required></textarea>

        <h2>Fotos</h2>
        <div class="duas-colunas">
          <div>
            <label>Foto de Fachada (Hero)</label>
            <input type="file" id="config-foto_fachada-arquivo" accept="image/*" onchange="enviarFotoConfig('foto_fachada')">
            <div class="status" id="status-foto-foto_fachada"></div>
            <img id="preview-foto_fachada" class="preview-foto" style="display:none;">
            <input type="hidden" id="config-foto_fachada_url">
          </div>
          <div>
            <label>Foto da Introdução (Garçom)</label>
            <input type="file" id="config-foto_intro-arquivo" accept="image/*" onchange="enviarFotoConfig('foto_intro')">
            <div class="status" id="status-foto-foto_intro"></div>
            <img id="preview-foto_intro" class="preview-foto" style="display:none;">
            <input type="hidden" id="config-foto_intro_url">
          </div>
          <div>
            <label>Banner iFood</label>
            <input type="file" id="config-ifood_banner-arquivo" accept="image/*" onchange="enviarFotoConfig('ifood_banner')">
            <div class="status" id="status-foto-ifood_banner"></div>
            <img id="preview-ifood_banner" class="preview-foto" style="display:none;">
            <input type="hidden" id="config-ifood_banner_url">
          </div>
        </div>

        <div class="botoes" style="margin-top: 20px;">
          <button type="submit" id="botao-salvar-config">Salvar Configurações</button>
        </div>
        <div class="status" id="status-form-config"></div>

      </form>
    </div>

  </div>

</div>
<script src="config.js"></script>
<script>
let SENHA_ATUAL = sessionStorage.getItem("rc_senha") || "";

function entrar() {
  const senha = document.getElementById("campo-senha").value;
  if (!senha) return;
  SENHA_ATUAL = senha;
  carregarPratos(true);
}

async function chamarApi(acao, dados) {
  const resposta = await fetch("/api/admin", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ senha: SENHA_ATUAL, acao, dados }),
  });
  const corpo = await resposta.json();
  if (!resposta.ok) throw new Error(corpo.erro || `Erro ${resposta.status}`);
  return corpo;
}

function mudarAba(aba) {
  document.querySelectorAll('.tab-admin').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));

  if (aba === 'pratos') {
    document.querySelectorAll('.tab-admin')[0].classList.add('active');
    document.getElementById('aba-pratos').classList.add('active');
  } else {
    document.querySelectorAll('.tab-admin')[1].classList.add('active');
    document.getElementById('aba-config').classList.add('active');
  }
}

async function carregarPratos(vindoDoLogin) {
  try {
    const resultado = await chamarApi("listar", {});
    const configResult = await chamarApi("buscar_config", {});

    sessionStorage.setItem("rc_senha", SENHA_ATUAL);
    document.getElementById("tela-login").style.display = "none";
    document.getElementById("tela-admin").style.display = "block";

    renderizarLista(resultado.pratos);
    preencherConfig(configResult.config);
  } catch (erro) {
    if (vindoDoLogin) {
      document.getElementById("erro-login").textContent = "Senha incorreta ou erro de conexão.";
    }
    sessionStorage.removeItem("rc_senha");
  }
}

function preencherConfig(config) {
  if (!config) return;
  document.getElementById("config-nome").value = config.nome || "";
  document.getElementById("config-subtitulo").value = config.subtitulo || "";
  document.getElementById("config-tag_hero").value = config.tag_hero || "";
  document.getElementById("config-instagram_arroba").value = config.instagram_arroba || "";
  document.getElementById("config-instagram_url").value = config.instagram_url || "";
  document.getElementById("config-telefone").value = config.telefone || "";
  document.getElementById("config-telefone_link").value = config.telefone_link || "";
  document.getElementById("config-endereco").value = config.endereco || "";
  document.getElementById("config-ifood_url").value = config.ifood_url || "";
  document.getElementById("config-sobre_titulo").value = config.sobre_titulo || "";
  document.getElementById("config-sobre_texto").value = config.sobre_texto || "";
  document.getElementById("config-ambiente_subtitulo").value = config.ambiente_subtitulo || "";

  ["foto_fachada", "foto_intro", "ifood_banner"].forEach(campo => {
    const url = config[`${campo}_url`];
    document.getElementById(`config-${campo}_url`).value = url || "";
    if (url) {
      document.getElementById(`preview-${campo}`).src = url;
      document.getElementById(`preview-${campo}`).style.display = "block";
    }
  });
}

async function salvarConfiguracoes(evento) {
  evento.preventDefault();
  const dados = {
    nome: document.getElementById("config-nome").value.trim(),
    subtitulo: document.getElementById("config-subtitulo").value.trim(),
    tag_hero: document.getElementById("config-tag_hero").value.trim(),
    instagram_arroba: document.getElementById("config-instagram_arroba").value.trim(),
    instagram_url: document.getElementById("config-instagram_url").value.trim(),
    telefone: document.getElementById("config-telefone").value.trim(),
    telefone_link: document.getElementById("config-telefone_link").value.trim(),
    endereco: document.getElementById("config-endereco").value.trim(),
    ifood_url: document.getElementById("config-ifood_url").value.trim(),
    sobre_titulo: document.getElementById("config-sobre_titulo").value.trim(),
    sobre_texto: document.getElementById("config-sobre_texto").value.trim(),
    ambiente_subtitulo: document.getElementById("config-ambiente_subtitulo").value.trim(),
    foto_fachada_url: document.getElementById("config-foto_fachada_url").value.trim(),
    foto_intro_url: document.getElementById("config-foto_intro_url").value.trim(),
    ifood_banner_url: document.getElementById("config-ifood_banner_url").value.trim(),
  };

  const status = document.getElementById("status-form-config");
  status.textContent = "Salvando configurações...";
  try {
    await chamarApi("atualizar_config", dados);
    status.textContent = "Configurações atualizadas com sucesso.";
    setTimeout(() => { status.textContent = ""; }, 3000);
  } catch (erro) {
    status.textContent = "Erro ao salvar: " + erro.message;
  }
}

let PRATOS_ATUAIS = [];

function renderizarLista(pratos) {
  PRATOS_ATUAIS = pratos;
  const container = document.getElementById("lista-pratos");
  if (!pratos.length) {
    container.innerHTML = '<p style="color:#6b5a48">Nenhum prato cadastrado ainda.</p>';
    return;
  }
  container.innerHTML = pratos.map(p => `
    <div class="card-prato">
      <div class="linha1">
        <span class="nome">${escapeHtml(p.nome)}</span>
        <span class="preco">R$ ${Number(p.preco).toFixed(2).replace(".", ",")}</span>
      </div>
      ${p.descricao ? `<div class="desc">${escapeHtml(p.descricao)}</div>` : ""}
      <span class="categoria-tag">${escapeHtml(p.categoria)}${p.ativo ? "" : " · oculto"}</span>
      <div class="acoes">
        <button class="secundario" onclick="editarPratoPorId('${p.id}')">Editar</button>
        <button class="secundario" onclick="alternarVisibilidade('${p.id}', ${!p.ativo})">${p.ativo ? "Ocultar" : "Mostrar"}</button>
        <button class="perigo" onclick="excluirPratoPorId('${p.id}')">Excluir</button>
      </div>
    </div>
  `).join("");
}

function editarPratoPorId(id) {
  const prato = PRATOS_ATUAIS.find(p => String(p.id) === String(id));
  if (prato) editarPrato(prato);
}

function excluirPratoPorId(id) {
  const prato = PRATOS_ATUAIS.find(p => String(p.id) === String(id));
  if (prato) excluirPrato(prato.id, prato.nome);
}

function editarPrato(prato) {
  document.getElementById("prato-id").value = prato.id;
  document.getElementById("prato-categoria").value = prato.categoria;
  document.getElementById("prato-nome").value = prato.nome;
  document.getElementById("prato-descricao").value = prato.descricao || "";
  document.getElementById("prato-preco").value = prato.preco;
  document.getElementById("prato-ordem").value = prato.ordem ?? 1;
  document.getElementById("prato-imagem").value = prato.imagem_url || "";

  const preview = document.getElementById("preview-imagem");
  if (prato.imagem_url) {
    preview.src = prato.imagem_url;
    preview.style.display = "block";
  } else {
    preview.style.display = "none";
  }
  document.getElementById("status-foto").textContent = "";

  document.getElementById("botao-salvar").textContent = "Salvar alterações";
  document.getElementById("botao-cancelar").style.display = "inline-block";
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function cancelarEdicao() {
  document.getElementById("form-prato").reset();
  document.getElementById("prato-id").value = "";
  document.getElementById("prato-imagem").value = "";
  document.getElementById("preview-imagem").style.display = "none";
  document.getElementById("status-foto").textContent = "";
  document.getElementById("botao-salvar").textContent = "Adicionar prato";
  document.getElementById("botao-cancelar").style.display = "none";
}

async function salvarPrato(evento) {
  evento.preventDefault();
  const id = document.getElementById("prato-id").value;
  const dados = {
    categoria: document.getElementById("prato-categoria").value.trim(),
    nome: document.getElementById("prato-nome").value.trim(),
    descricao: document.getElementById("prato-descricao").value.trim(),
    preco: parseFloat(document.getElementById("prato-preco").value),
    ordem: parseInt(document.getElementById("prato-ordem").value || "1", 10),
    imagem_url: document.getElementById("prato-imagem").value.trim(),
  };
  const status = document.getElementById("status-form");
  status.textContent = "Salvando…";
  try {
    if (id) {
      await chamarApi("atualizar", { id, ...dados });
      status.textContent = "Prato atualizado.";
    } else {
      await chamarApi("criar", dados);
      status.textContent = "Prato adicionado.";
    }
    cancelarEdicao();
    carregarPratos(false);
  } catch (erro) {
    status.textContent = "Erro ao salvar: " + erro.message;
  }
}

async function alternarVisibilidade(id, novoAtivo) {
  await chamarApi("atualizar", { id, ativo: novoAtivo });
  carregarPratos(false);
}

async function excluirPrato(id, nome) {
  if (!confirm(`Excluir "${nome}" do cardápio? Essa ação não pode ser desfeita.`)) return;
  await chamarApi("excluir", { id });
  carregarPratos(false);
}

function escapeHtml(texto) {
  const div = document.createElement("div");
  div.textContent = texto ?? "";
  return div.innerHTML;
}

// ---------- UPLOAD DE FOTO (direto do PC, sem precisar de URL) ----------
function redimensionarImagem(arquivo, maxLargura, qualidade) {
  return new Promise((resolve, reject) => {
    const leitor = new FileReader();
    leitor.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        let largura = img.width;
        let altura = img.height;
        if (largura > maxLargura) {
          altura = Math.round(altura * (maxLargura / largura));
          largura = maxLargura;
        }
        const canvas = document.createElement("canvas");
        canvas.width = largura;
        canvas.height = altura;
        canvas.getContext("2d").drawImage(img, 0, 0, largura, altura);
        resolve(canvas.toDataURL("image/jpeg", qualidade));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    leitor.onerror = reject;
    leitor.readAsDataURL(arquivo);
  });
}

async function enviarFoto() {
  const arquivo = document.getElementById("prato-imagem-arquivo").files[0];
  if (!arquivo) return;
  const statusFoto = document.getElementById("status-foto");
  statusFoto.textContent = "Enviando foto…";
  try {
    const dataUrl = await redimensionarImagem(arquivo, 1200, 0.8);
    const base64 = dataUrl.split(",")[1];
    const nomeArquivo = Date.now() + "-" + arquivo.name.replace(/[^a-zA-Z0-9.\-_]/g, "");
    const resultado = await chamarApi("upload", { nome_arquivo: nomeArquivo, conteudo_base64: base64, tipo: "image/jpeg" });
    document.getElementById("prato-imagem").value = resultado.url;
    const preview = document.getElementById("preview-imagem");
    preview.src = resultado.url;
    preview.style.display = "block";
    statusFoto.textContent = "Foto enviada!";
  } catch (erro) {
    statusFoto.textContent = "Erro ao enviar foto: " + erro.message;
  }
}

async function enviarFotoConfig(campo) {
  const arquivo = document.getElementById(`config-${campo}-arquivo`).files[0];
  if (!arquivo) return;
  const statusFoto = document.getElementById(`status-foto-${campo}`);
  statusFoto.textContent = "Enviando foto…";
  try {
    const dataUrl = await redimensionarImagem(arquivo, 1600, 0.8);
    const base64 = dataUrl.split(",")[1];
    const nomeArquivo = Date.now() + "-config-" + arquivo.name.replace(/[^a-zA-Z0-9.\-_]/g, "");
    const resultado = await chamarApi("upload", { nome_arquivo: nomeArquivo, conteudo_base64: base64, tipo: "image/jpeg" });

    document.getElementById(`config-${campo}_url`).value = resultado.url;
    const preview = document.getElementById(`preview-${campo}`);
    preview.src = resultado.url;
    preview.style.display = "block";
    statusFoto.textContent = "Foto enviada!";
  } catch (erro) {
    statusFoto.textContent = "Erro ao enviar foto: " + erro.message;
  }
}

if (SENHA_ATUAL) carregarPratos(false);
</script>
</body>
</html>
